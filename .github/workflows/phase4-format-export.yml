name: Phase 4 Format Export

on:
  push:
    branches:
      - feature/bytespace-new

permissions:
  contents: write

jobs:
  format-export:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: feature/bytespace-new

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.0.9
        with:
          version: 12.7.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format source
        run: pnpm format

      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No formatting changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests docs
          git commit -m "style: format phase 4 catalogue"
          git push origin HEAD:feature/bytespace-new
