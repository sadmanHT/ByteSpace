name: Phase 6 Format Export

on:
  push:
    branches:
      - feature/bytespace-new

permissions:
  contents: read

jobs:
  format-export:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.0.9
        with:
          version: 12.7.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format Phase 6 E2E
        run: pnpm exec prettier --write tests/e2e/auth-404.spec.ts

      - name: Upload formatted test
        uses: actions/upload-artifact@v7
        with:
          name: phase6-formatted-test
          path: tests/e2e/auth-404.spec.ts
          if-no-files-found: error
          retention-days: 1
