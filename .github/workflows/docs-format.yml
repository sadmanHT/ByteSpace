name: Documentation Format

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/docs-format.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: true

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.0.9
        with:
          version: 12.7.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format documentation
        run: >
          pnpm exec prettier --write
          README.md
          CONTRIBUTING.md
          SECURITY.md
          docs/README.md
          docs/WALKTHROUGH.md
          docs/phase10-release-audit.md
          .github/PULL_REQUEST_TEMPLATE.md

      - name: Commit formatting
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             README.md             CONTRIBUTING.md             SECURITY.md             docs/README.md             docs/WALKTHROUGH.md             docs/phase10-release-audit.md             .github/PULL_REQUEST_TEMPLATE.md

          if git diff --cached --quiet; then
            echo "Documentation is already formatted."
            exit 0
          fi

          git commit -m "style: format repository documentation"
          git push origin HEAD:main
