name: Phase 7 Format Export

on:
  push:
    branches:
      - feature/bytespace-new

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.0.9

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format Phase 7 files
        run: |
          pnpm exec prettier --write \
            src/components/creator/creator-profile.tsx \
            src/components/discovery/search-experience.tsx \
            tests/e2e/phase7-discovery.spec.ts

      - name: Upload formatted files
        uses: actions/upload-artifact@v7
        with:
          name: phase7-formatted
          path: |
            src/components/creator/creator-profile.tsx
            src/components/discovery/search-experience.tsx
            tests/e2e/phase7-discovery.spec.ts
          retention-days: 1
