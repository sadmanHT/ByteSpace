name: Format Export

on:
  push:
    branches:
      - feature/bytespace-new

permissions:
  contents: read

jobs:
  format-export:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.7.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format source
        run: pnpm format

      - name: Package formatted source
        run: tar -czf formatted-source.tar.gz README.md docs src tests

      - name: Upload formatted source
        uses: actions/upload-artifact@v7
        with:
          name: formatted-source
          path: formatted-source.tar.gz
          if-no-files-found: error
          retention-days: 1
